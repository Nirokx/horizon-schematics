[mod]
id = "schematics"
version = "1.0.0"
priority = 100

# Pinned: besides the native hook points it reads the game's block models,
# atlas and world, the single player server's levels and the connected
# server, which are not part of the stable hook points.
[compatibility]
horizon_revision = "c9d474dd9116e84c243f8992d75c11314df56f06"

# Schematic formats, placements, the material list and the menus.
[[crate]]
id = "engine"
path = "engine"

# The game's side: block states, ghost meshes, pasting and saving.
[[module]]
id = "bridge"
file = "crates/horizon-client/src/game.rs"
name = "schematics_bridge"
source = "bridge.rs"

# The renderer's side: the ghosts drawn over the world.
[[module]]
id = "ghost"
file = "crates/horizon-client-render/src/lib.rs"
name = "schematics_ghost"
source = "ghost.rs"
visibility = "pub"

[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

[[injection]]
id = "reload"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_client_resources_reloaded"
helper = "reload.rs"
